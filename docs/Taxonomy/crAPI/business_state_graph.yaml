
schema_version: "0.1"
app: crapi
status: draft

taxonomy_ref: docs/Taxonomy/families.yaml
access_policy_ref: docs/Taxonomy/crAPI/access_policy.yaml
flaw_catalog_ref: docs/Taxonomy/crAPI/flaw_catalog.yaml

entities:
  order:
    description: A purchased item and its return lifecycle.

    state_field: status

    states:
      delivered:
        description: Order has been delivered.
        terminal: false

      "return pending":
        description: A return has been requested.
        terminal: false

      returned:
        description: Return has been completed.
        terminal: true
    
    initial: delivered

    transitions:
      - id: ORDER-T01
        from: delivered
        to: "return pending"
        operation: "POST /workshop/api/shop/orders/return_order?order_id={order_id}"
        actor: {role: user, relation: owner}
        status: draft

      - id: ORDER-T02
        from: "return pending"
        to: returned
        operation: "PUT /workshop/api/shop/orders/{order_id}"
        request_body: {status: returned}
        actor: {role: admin}
        status: draft   # reference run must confirm admin can do this

    negative_edges:
      generate: true            # every (from, to) pair not in transitions, including skip and repeat
      exclude: []               # list pairs the app handles as legitimate no-ops

    invariants:
      - id: ORDER-I01
        description: A completed return cannot be processed again.
        observe: {read: "GET /workshop/api/shop/orders/{order_id}", field: status}
        holds_if: "status == returned after any further transition attempt"
        status: proposed

      - id: ORDER-I02
        description: A return must not be completed more than once.
        observe: {read: "GET /workshop/api/shop/orders/{order_id}", field: refund_history}   # admin-readable per field_policy
        holds_if: "len(refund_history) <= 1"
        status: proposed

evaluation:
  oracle: state_invariant

  rules:
    - An attempted transition must exist in the declared transition graph.
    - The actor must satisfy the transition's authorization requirements.
    - All applicable invariants must hold after the transition.
    - A rejected transition must leave the business state unchanged.

  evidence:
    - attempted_edge
    - actor
    - before_state
    - after_state
    - response
    - invariant_results
