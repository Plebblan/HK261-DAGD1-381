schema_version: "0.1"
app: crapi
taxonomy_ref: docs/Taxonomy/families.yaml
flaw_catalog_ref: docs/Taxonomy/crAPI/flaw_catalog.yaml

default: deny
role-relation mapping to flaw_catalog:
actors:
  owner_a:   {role: user}
  user_b:    {role: user}
  admin:     {role: admin}
  anonymous: {role: anonymous}
relations: [owner, non_owner]

rules:
  - op: GET /community/api/v2/community/posts/recent
    allow: [{role: anonymous}, {role: user}, {role: admin}]
  - op: GET /identity/api/v2/vehicle/{vehicle_id}/location
    allow: [{role: user, relation: owner}, {role: admin}]
  - op: GET /identity/api/v2/user/videos/{video_id}
    allow: [{role: user, relation: owner}, {role: admin}]
  - op: PUT /identity/api/v2/user/videos/{video_id}
    allow: [{role: user, relation: owner}, {role: admin}]
  - op: GET /workshop/api/shop/orders/{order_id}
    allow: [{role: user, relation: owner}, {role: admin}]
  - op: PUT /workshop/api/shop/orders/{order_id}
    allow: [{role: user, relation: owner}, {role: admin}]
  - op: DELETE /identity/api/v2/admin/videos/{video_id}
    allow: [{role: admin}]
  - op: GET /workshop/api/mechanic/mechanic_report?report_id={report_id}
    allow: [{role: user, relation: owner}, {role: admin}]

field_policy:
  community_post:
    allowed_set_source: captured_reference   # build from owner_a's real response, don't hand-write
    read:
      anonymous: [id, title, content, created_at, author.nickname, author.email, author.profile_pic_url]  
      user:      [id, title, content, created_at, author.nickname, author.email, author.profile_pic_url]
      admin:     [id, title, content, created_at, author.nickname, author.email, author.profile_pic_url, author.vehicleid]
  video:
    read:
      user:  [id, video_name]
      admin: [id, video_name, conversion_params]
    write:
      user:  [video_name]
      admin: [video_name, conversion_params]   # admin keeps user's writable set
  order:
    read:
      user: [id, status, quantity, total_amount, item_name]
      admin: [id, status, quantity, total_amount, item_name, refund_history]
    write:
      user: [status]
      admin: [status, quantity]