[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hk261-dagd1-381"
version = "0.1.0"
description = "Controlled, stateful API security testing gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mitmproxy>=11",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
"src.store" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
