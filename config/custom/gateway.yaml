target_id: custom
target:
  base_url: http://127.0.0.1:8000
openapi:
  source: http://127.0.0.1:8000/openapi-source.json
scope:
  in_scope_hosts: ["127.0.0.1:8000"]
  out_of_scope_default: block
  pass_hosts: []
undocumented_policy: block
approved_patterns:
  - {method: "*", path: "*"}
operation_overrides:
  "POST /__lab/auth/token":
    destructiveness: create
    tags: [auth, bootstrap]
  "POST /__lab/reset":
    destructiveness: terminal
    tags: [control, reset]
extra_methods:
  - {id: lab_issue_token, method: POST, path: /__lab/auth/token, destructiveness: create}
  - {id: lab_reset, method: POST, path: /__lab/reset, destructiveness: terminal}
budgets:
  max_requests_per_run: 5000
  rate_per_second: 10
  max_concurrency: 2
destructiveness:
  enabled_tags: [read, create, mutate, advance]
  disabled_tags: [terminal, session_affecting, unknown]
dry_run: false
