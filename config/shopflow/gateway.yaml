target_id: shopflow
target:
  base_url: http://127.0.0.1:8002
openapi:
  source: http://127.0.0.1:8002/openapi.json
scope:
  in_scope_hosts: ["127.0.0.1:8002"]
  out_of_scope_default: block
  pass_hosts: []
undocumented_policy: block
approved_patterns:
  - {method: "*", path: "*"}
operation_overrides:
  "POST /auth/login":
    destructiveness: create
    tags: [auth, bootstrap]
  "POST /_lab/reset":
    destructiveness: terminal
    tags: [control, reset]
  "GET /_lab/health":
    destructiveness: read
    tags: [control, health]
extra_methods:
  - {id: auth_login, method: POST, path: /auth/login, destructiveness: create}
  - {id: lab_reset, method: POST, path: /_lab/reset, destructiveness: terminal}
  - {id: lab_health, method: GET, path: /_lab/health, destructiveness: read}
budgets:
  max_requests_per_run: 5000
  rate_per_second: 10
  max_concurrency: 2
destructiveness:
  enabled_tags: [read, create, mutate, advance]
  disabled_tags: [terminal, session_affecting, unknown]
dry_run: false
