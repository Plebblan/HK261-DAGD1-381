      "resource_type": "document",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "readable documents of own tenant"
    },
    {
      "App": "tenantdesk",
      "id": "get_document",
      "method": "GET",
      "path": "/documents/{doc_id}",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "owner | Admin | shared_with | (visibility=tenant and State=published)"
    },
    {
      "App": "tenantdesk",
      "id": "update_document",
      "method": "PUT",
      "path": "/documents/{doc_id}",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "mutable_properties_only",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_admin",
      "precondition": {
        "State": [
          "draft"
        ]
      },
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "delete_document",
      "method": "DELETE",
      "path": "/documents/{doc_id}",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "delete",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_admin",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
