        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "relationship_change",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_admin",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "target user must belong to the document's tenant"
    },
    {
      "App": "tenantdesk",
      "id": "submit_document",
      "method": "POST",
      "path": "/documents/{doc_id}/submit",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "workflow_transition",
      "tenant_scope": "same_tenant",
      "ownership": "owner_only",
      "precondition": {
        "State": [
          "draft"
        ]
      },
      "postcondition": {
        "State": "review"
      }
    },
    {
      "App": "tenantdesk",
      "id": "approve_document",
      "method": "POST",
      "path": "/documents/{doc_id}/approve",
      "roles": [
        "Agent",
        "Admin"
      ],
      "resource_type": "document",
      "state_effect": "workflow_transition",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {
        "State": [
          "review"
        ]
      },
      "postcondition": {
        "State": "published"
      },
      "rule": "approver must not be the document owner"
    },
    {
      "App": "tenantdesk",
