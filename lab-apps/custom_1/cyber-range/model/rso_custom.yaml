    {
      "App": "tenantdesk",
      "id": "login",
      "method": "POST",
      "path": "/auth/login",
      "roles": [
        "*"
      ],
      "resource_type": "none",
      "state_effect": "session_create",
      "tenant_scope": "none",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "logout",
      "method": "POST",
      "path": "/auth/logout",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "none",
      "state_effect": "session_destroy",
      "tenant_scope": "none",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "get_me",
      "method": "GET",
      "path": "/users/me",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "user",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "self",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "patch_me",
      "method": "PATCH",
      "path": "/users/me",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "user",
      "state_effect": "mutable_properties_only",
      "tenant_scope": "same_tenant",
      "ownership": "self",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "display_name/email only; role is not client-mutable"
    },
    {
      "App": "tenantdesk",
      "id": "list_users",
      "method": "GET",
      "path": "/users",
