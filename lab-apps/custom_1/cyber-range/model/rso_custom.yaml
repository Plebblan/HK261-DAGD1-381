      "resource_type": "user",
      "state_effect": "delete",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "not self"
    },
    {
      "App": "tenantdesk",
      "id": "create_ticket",
      "method": "POST",
      "path": "/tickets",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "create",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {},
      "postcondition": {
        "State": "open"
      }
    },
    {
      "App": "tenantdesk",
      "id": "list_tickets",
      "method": "GET",
      "path": "/tickets",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "get_ticket",
      "method": "GET",
      "path": "/tickets/{ticket_id}",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "patch_ticket",
      "method": "PATCH",
      "path": "/tickets/{ticket_id}",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "mutable_properties_only",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "Member: title/body only; priority/status/assignee_id need Agent/Admin"
    },
    {
      "App": "tenantdesk",
      "id": "delete_ticket",
      "method": "DELETE",
      "path": "/tickets/{ticket_id}",
      "roles": [
        "Member",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "delete",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_admin",
      "precondition": {},
      "postcondition": "no_state_change"
    },
    {
      "App": "tenantdesk",
      "id": "add_comment",
      "method": "POST",
      "path": "/tickets/{ticket_id}/comments",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "comment",
      "state_effect": "create",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "internal=true honoured for Agent/Admin only"
    },
    {
      "App": "tenantdesk",
      "id": "list_comments",
      "method": "GET",
      "path": "/tickets/{ticket_id}/comments",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "comment",
      "state_effect": "read",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "internal comments hidden from Member"
    },
    {
      "App": "tenantdesk",
      "id": "assign_ticket",
      "method": "POST",
      "path": "/tickets/{ticket_id}/assign",
      "roles": [
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "relationship_change",
      "tenant_scope": "same_tenant",
      "ownership": "none",
      "precondition": {},
      "postcondition": "no_state_change",
      "rule": "assignee: same tenant, role Agent/Admin"
    },
    {
      "App": "tenantdesk",
      "id": "transition_ticket",
      "method": "POST",
      "path": "/tickets/{ticket_id}/transition",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
      "resource_type": "ticket",
      "state_effect": "workflow_transition",
      "tenant_scope": "same_tenant",
      "ownership": "owner_or_agent_admin",
      "precondition": {
        "State": [
          "open",
          "in_progress",
          "resolved"
        ]
      },
      "postcondition": {
        "State": "per workflow-ticket"
      },
      "rule": "Member (owner): resolved->closed|open only; Agent/Admin: edges of workflow-ticket"
    },
    {
      "App": "tenantdesk",
      "id": "create_document",
      "method": "POST",
      "path": "/documents",
      "roles": [
        "Member",
        "Agent",
        "Admin"
      ],
