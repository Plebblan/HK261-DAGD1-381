{
  "schema_version": "0.1",
  "apps": [
    "tenantdesk",
    "shopflow"
  ],
  "status": "draft",
  "taxonomy_ref": "docs/Taxonomy/families.yaml",
  "taxonomy_decisions_applied": {
    "D1": "exactly one primary family per case; other applicable families are listed in secondary_families (F1 = same tenant, F4 = across a tenant boundary)",
    "D2": "anonymous is a regular actor; BENIGN-106 and BENIGN-206 cover the unauthenticated deny path (broken authentication itself is out of scope)",
    "D3": "401, 403 and 404 are equivalent safe outcomes for deny checks; the exact set per case is in expected_safe_status",
    "D4": "F5 covers state-transition violations only; no rate/volume/automation cases",
    "D5": "read-only leaks (F3 subtype R) count as findings, judged against allowed_field_set / forbidden_field_set"
  },
  "evidence_common": [
    "request",
    "response",
    "status",
    "body_diff",
    "before_after_state",
    "test_actor",
    "seed",
    "action_id",
    "timestamp",
    "raw_hash"
  ],
  "defaults": {
    "verification_status": "pending-human-review",
    "verified_by": null,
    "verified_at": null
  },
  "oracle_execution": {
    "note": "vulnerable_if is the machine-checkable form of observed_when_enabled; a case is VULNERABLE when every condition holds. A case is SAFE when status is in expected_safe_status and vulnerable_if is false.",
    "conditions": {
      "status_2xx": "HTTP status is 200-299",
      "body_has_key": "response JSON object contains the key",
      "body_field_eq": "response JSON object has key == value for every pair",
      "list_any": "response JSON array contains at least one row matching every pair",
      "list_all_have_key": "response JSON array is non-empty and every row contains the key"
    }
  },
  "family_profiles": {
    "F1": {
      "name": "BOLA / IDOR (same tenant)",
      "oracle_type": "differential_authorization",
      "mapping": {
        "cwe": "CWE-639",
        "owasp_api_2023": "API1:2023"
      },
      "evidence_required": [
        "owner_baseline_response",
        "test_actor_response",
        "object_id_origin"
      ]
    },
    "F2": {
      "name": "BFLA",
      "oracle_type": "differential_authorization",
      "mapping": {
        "cwe": "CWE-285",
        "owasp_api_2023": "API5:2023"
      },
      "evidence_required": [
        "role_matrix_cell",
        "before_after_state"
      ]
    },
    "F3": {
      "name": "BOPLA",
      "oracle_type": "property_policy_diff",
      "subtypes": {
        "R": {
          "name": "Excessive data exposure",
          "mapping": {
            "cwe": "CWE-213",
            "owasp_api_2023": "API3:2023"
          },
          "evidence_required": [
            "returned_field_set",
            "allowed_field_set"
          ]
        },
        "W": {
          "name": "Mass assignment",
          "mapping": {
            "cwe": "CWE-915",
            "owasp_api_2023": "API3:2023"
          },
          "evidence_required": [
            "request_body",
            "readback_before",
            "readback_after"
          ]
        }
      }
    },
    "F4": {
      "name": "Tenant isolation breakage",
      "oracle_type": "differential_authorization",
      "mapping": {
        "cwe": "CWE-639",
        "owasp_api_2023": "API1:2023"
      },
      "mapping_note": "taxonomy has no dedicated OWASP category for F4; mapped to API1:2023 as BOLA across a tenant boundary",
      "evidence_required": [
        "actor_tenant_id",
        "object_tenant_id"
      ],
      "evidence_required_collection": [
        "list_contents"
      ]
    },
    "F5": {
      "name": "Bounded workflow abuse (state-transition violations)",
      "oracle_type": "state_invariant",
      "mapping": {
        "cwe": "CWE-841",
        "owasp_api_2023": "API6:2023"
      },
      "evidence_required": [
        "attempted_edge",
        "violated_invariant",
        "before_after_state"
      ]
    }
  },
