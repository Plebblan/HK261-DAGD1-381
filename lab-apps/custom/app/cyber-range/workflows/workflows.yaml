{
  "version": 2,
  "workflows": [
    {
      "ID": "workflow-order-refund",
      "Name": "Order refund lifecycle",
      "Steps": [
        {
          "Action": "read_order",
          "OperationID": "get_resource",
          "Actor": "actor-customer-a",
          "ObjectID": "order-a-001",
          "Precondition": {
            "State": [
              "delivered",
              "return_pending"
            ]
          },
          "Postcondition": {
            "State": "delivered_or_return_pending"
          }
        },
        {
          "Action": "request_return",
          "OperationID": "transition_resource",
          "Actor": "actor-customer-a",
          "ObjectID": "order-a-001",
          "Precondition": {
            "State": [
              "delivered"
            ],
            "Action": "request_return"
          },
          "Postcondition": {
            "State": "return_pending"
          }
        },
        {
          "Action": "approve_refund",
          "OperationID": "transition_resource",
          "Actor": "actor-admin-a",
          "ObjectID": "order-a-001",
          "Precondition": {
            "State": [
              "return_pending"
            ],
            "Action": "approve_refund",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "returned"
          }
        }
      ]
    },
    {
      "ID": "workflow-ticket",
      "Name": "Support ticket lifecycle",
      "Steps": [
        {
          "Action": "read_ticket",
          "OperationID": "get_resource",
          "Actor": "actor-customer-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": "open"
          },
          "Postcondition": "no_state_change"
        },
        {
          "Action": "assign_ticket",
          "OperationID": "transition_resource",
          "Actor": "actor-support-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": [
              "open"
            ],
            "Action": "assign",
            "Role": [
              "Support",
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "assigned"
          }
        },
        {
          "Action": "close_ticket",
          "OperationID": "transition_resource",
          "Actor": "actor-support-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": [
              "assigned"
            ],
            "Action": "close",
            "Role": [
              "Support",
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "closed"
          }
        }
      ]
    },
    {
      "ID": "workflow-invoice-payment",
      "Name": "Seeded invoice submission and payment",
      "Steps": [
        {
          "Action": "read_invoice",
          "OperationID": "get_invoice",
          "Actor": "actor-supplier-a",
          "ObjectID": "invoice-a-001",
          "Precondition": {
            "State": "draft"
          },
          "Postcondition": "no_state_change"
        },
        {
          "Action": "submit_invoice",
          "OperationID": "submit_invoice",
          "Actor": "actor-supplier-a",
          "ObjectID": "invoice-a-001",
          "Precondition": {
            "State": "draft"
          },
          "Postcondition": {
            "State": "submitted"
          }
        },
        {
          "Action": "approve_invoice",
          "OperationID": "approve_invoice",
          "Actor": "actor-admin-a",
          "ObjectID": "invoice-a-001",
          "Precondition": {
            "State": "submitted",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "approved"
          }
        },
        {
          "Action": "pay_invoice",
          "OperationID": "pay_invoice",
          "Actor": "actor-admin-a",
          "ObjectID": "invoice-a-001",
          "Precondition": {
            "State": "approved",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "paid"
          }
        }
      ]
    },
    {
      "ID": "workflow-payout-release",
      "Name": "Payout approval and release",
      "Steps": [
        {
          "Action": "approve_payout",
          "OperationID": "approve_payout",
          "Actor": "actor-admin-a",
          "ObjectID": "payout-a-001",
          "Precondition": {
            "State": "pending",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "approved"
          }
        },
        {
          "Action": "release_payout",
          "OperationID": "release_payout",
          "Actor": "actor-admin-a",
          "ObjectID": "payout-a-001",
          "Precondition": {
            "State": "approved",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "released"
          }
        }
      ]
    },
    {
      "ID": "workflow-ticket-escalation",
      "Name": "Assigned ticket escalation and resolution",
      "Steps": [
        {
          "Action": "assign_ticket",
          "OperationID": "transition_resource",
          "Actor": "actor-support-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": [
              "open"
            ],
            "Action": "assign",
            "Role": [
              "Support",
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "assigned"
          }
        },
        {
          "Action": "escalate_ticket",
          "OperationID": "escalate_ticket",
          "Actor": "actor-support-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": "assigned",
            "Role": [
              "Support",
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "escalated"
          }
        },
        {
          "Action": "resolve_ticket",
          "OperationID": "resolve_ticket",
          "Actor": "actor-admin-a",
          "ObjectID": "ticket-a-001",
          "Precondition": {
            "State": "escalated",
            "Role": [
              "Admin"
            ]
          },
          "Postcondition": {
            "State": "resolved"
          }
        }
      ]
    }
  ]
}
