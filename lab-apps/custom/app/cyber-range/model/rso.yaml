  "authorization_dimensions": [
    "role",
    "owner",
    "tenant",
    "resource_type",
    "state",
    "mutable_properties"
  ],
  "vulnerability_flags": {
    "configuration": "LAB_VULNERABILITIES",
    "default": "disabled",
    "wildcard": "*",
    "flags": [
      "AUTHZ-001..020",
      "AUTHZ-INV-01..03",
      "AUTHZ-PAY-01..02",
      "AUTHZ-TCK-01",
      "AUTHZ-REV-01..02"
