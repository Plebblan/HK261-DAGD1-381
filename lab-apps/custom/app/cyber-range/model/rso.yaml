  "actions": [
    {
      "id": "get_resource",
      "method": "GET",
      "path": "/lab/v1/resources/{resource_id}",
      "roles": [
        "Customer",
        "Support",
        "Admin"
      ],
      "resource_type": "any",
      "state_effect": "read"
    },
    {
      "id": "update_resource",
      "method": "PATCH",
      "path": "/lab/v1/resources/{resource_id}",
      "roles": [
        "Customer",
        "Support",
        "Admin"
      ],
      "resource_type": "any",
      "state_effect": "mutable_properties_only"
    },
    {
      "id": "delete_resource",
      "method": "DELETE",
      "path": "/lab/v1/resources/{resource_id}",
      "roles": [
        "Customer",
        "Support",
        "Admin"
      ],
      "resource_type": "any",
      "state_effect": "delete"
    },
    {
      "id": "transition_resource",
      "method": "POST",
      "path": "/lab/v1/resources/{resource_id}/actions/{action}",
