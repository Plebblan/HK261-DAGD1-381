      "state_effect": "privileged_action"
    },
    {
      "id": "issue_lab_token",
      "method": "POST",
      "path": "/__lab/auth/token",
      "roles": [
        "Public"
      ],
      "resource_type": "none",
      "state_effect": "session_create"
    },
    {
      "id": "list_invoices",
      "method": "GET",
      "path": "/lab/v1/invoices",
